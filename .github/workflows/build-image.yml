name: Build image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap, once per run: resolve the version and enforce the release guard
  # before spending four arm64 runners on it. The guard checks config files
  # shared by every leg, so running it per matrix leg would be redundant.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="dev-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      # An unauthenticated root shell (systemd.debug-shell=1) must never ship
      # in a public, non-prerelease image. Prerelease tags (v1.0.0-rc1) are
      # allowed through so the release path can be exercised while testing.
      - name: Release guard
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          # The shared base and every per-line config that includes it.
          if grep -lE '^[[:space:]]*debug_shell:' pinball/pinball.yaml pinball/pinball-mpf*.yaml; then
            echo "::error::a config above still enables the pinball-debug-shell layer; comment it out before tagging a release (or use a -rc prerelease tag)."
            exit 1
          fi

  build:
    needs: prepare
    # Native arm64: rpi-image-gen only formally supports arm64 Debian hosts,
    # and our Dockerfile's amd64 path is unverified. 4 vCPU / 16 GB / 14 GB
    # disk on public repos, free and unmetered.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      # One leg per (Pi model, MPF line), in parallel — each gets its own
      # runner, so the tight disk budget below is per-leg. fail-fast off so a
      # problem with one leg still yields the others' images to look at.
      # Keep in step with MODELS / MPF_LINES in scripts/image-name.sh.
      fail-fast: false
      matrix:
        model: [pi4, pi5]
        # Quoted: unquoted YAML would read 0.80 as the float 0.8.
        mpf: ['0.57', '0.80']
    env:
      # Read by scripts/image-name.sh (and so build.sh) in every step below.
      MPF_VERSION: ${{ matrix.mpf }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      # One canonical basename per leg, from the same script build.sh uses, so
      # every asset below agrees: pinbos-mpf80-rpi5-v0.4.0
      - name: Resolve artifact name
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MODEL: ${{ matrix.model }}
        run: |
          BASE="$(./scripts/image-name.sh "$MODEL" "$TAG")"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "Artifact basename: $BASE"

      - name: Build image (same script as local)
        env:
          RPI_IMAGE_OUT_DIR: ${{ runner.temp }}/out
          RPI_IMAGE_OUT_NAME: ${{ env.BASE }}.img
        run: ./build.sh ${{ matrix.model }} ${{ matrix.mpf }}

      - name: Compress, hash, write manifest
        working-directory: ${{ runner.temp }}/out
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MODEL: ${{ matrix.model }}
          XZ_LEVEL: ${{ vars.XZ_LEVEL || '-6' }}
        run: |
          df -h /
          ls -la
          xz -T0 "$XZ_LEVEL" -k -v "$BASE.img"
          sha256sum "$BASE.img.xz" > "$BASE.img.xz.sha256"
          python3 "$GITHUB_WORKSPACE/imager/gen-os-list.py" entry \
            --img "$BASE.img" --xz "$BASE.img.xz" \
            --model "$MODEL" --mpf "$MPF_VERSION" --version "$TAG" \
            --godot-version "$("$GITHUB_WORKSPACE/scripts/image-name.sh" --godot-version)" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$BASE.img.xz" \
            --release-date "$(date -u +%Y-%m-%d)" \
            -o "$BASE.manifest.json"
          rm "$BASE.img"
          ls -la
          cat "$BASE.manifest.json"
          df -h /

      # Always, not just for test builds: the release job below collects these.
      # Per-leg name (model + MPF line) so the four legs don't collide.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinbos-${{ matrix.model }}-mpf${{ matrix.mpf }}-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/out
          retention-days: 1

  # Publishing from inside the matrix would run once per leg against one tag:
  # assets would append fine, but every leg asking for generate_release_notes
  # races on the release body. Collect all legs' assets and publish once.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pinbos-*
          merge-multiple: true
          path: out

      - run: ls -la out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/pinbos-*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  # Releases created with GITHUB_TOKEN do not fire `release:` events, so the
  # Imager repo must be regenerated explicitly here.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    uses: ./.github/workflows/publish-imager-repo.yml
    permissions:
      contents: read
      pages: write
      id-token: write
