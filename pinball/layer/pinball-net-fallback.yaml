# METABEGIN
# X-Env-Layer-Name: pinball-net-fallback
# X-Env-Layer-Category: net-misc
# X-Env-Layer-Desc: Fallback static IP on eth0 (default 192.168.50.2/24)
#  when DHCP doesn't answer, so a laptop on a direct Ethernet cable can reach
#  the machine with no router -- e.g. at a show. eth0 still uses DHCP
#  normally; pinball-net-fallback.service adds the address only after
#  DHCP_TIMEOUT seconds of link with no lease, and removes it once a lease
#  arrives. It does this with a runtime systemd-networkd drop-in under /run,
#  so it works on the read-only root and resets at reboot (see
#  pinball/assets/pinball-net-fallback). Settings live in
#  /etc/default/pinball-network.
#
#  Also turns on IPv4 link-local addressing for eth0 (networkd's default is
#  IPv6 only), so a directly cabled laptop that self-assigns 169.254.x.x can
#  reach the Pi on that subnet as well.
#
#  eth0 belongs to systemd-networkd on this image; NetworkManager is scoped
#  to wlan0 by pinball-networkmanager, and that split is unchanged here.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: systemd-net-min
# METAEND
---
mmdebstrap:
  packages:
    # `ip` for the watcher's address checks.
    - iproute2
  customize-hooks:
    - |-
      # A drop-in, not an edit to 01-eth0.network itself: that file is
      # generated by upstream's rpi device layer (family-base.yaml), and
      # systemd merges drop-ins at parse time, so hook order doesn't matter.
      mkdir -p "$1/etc/systemd/network/01-eth0.network.d"
      printf '[Network]\nLinkLocalAddressing=yes\n' > "$1/etc/systemd/network/01-eth0.network.d/10-pinball-linklocal.conf"
    - install -m 755 /home/imagegen/pinball/assets/pinball-net-fallback $1/usr/local/sbin/pinball-net-fallback
    - install -m 644 /home/imagegen/pinball/assets/pinball-network.default $1/etc/default/pinball-network
    - install -m 644 /home/imagegen/pinball/assets/pinball-net-fallback.service $1/etc/systemd/system/pinball-net-fallback.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" pinball-net-fallback
