# METABEGIN
# X-Env-Layer-Name: pinball-mpf
# X-Env-Layer-Category: app-misc
# X-Env-Layer-Desc: Mission Pinball Framework (MPF) + mpf-mc installed into a
#  dedicated venv at /opt/mpf/venv, with P-ROC/P3-ROC hardware support. The
#  release line is set by the `version` variable below. No machine folder
#  (game code) baked in, and MPF is not started automatically — ssh in and
#  run `mpf both <machine_path>` manually once a machine folder is added.
# X-Env-Layer-Version: 1.1.0
# X-Env-Layer-Requires: device-user-admin
#
# X-Env-VarPrefix: mpf
#
# X-Env-Var-version: 0.57
# X-Env-Var-version-Desc: MPF release line to install, as a pip
#  compatible-release pin (mpf~=<version>.0), so the exact patch floats within
#  the series. THIS LINE IS THE SINGLE SOURCE OF TRUTH FOR THE MPF VERSION:
#  the install hook below uses it, and scripts/image-name.sh greps it (on the
#  host, outside the container) to build the mpf<NN> token in artifact
#  filenames — so a released file can never claim an MPF version the image
#  does not have. Override for a one-off with `MPF_VERSION=0.60 ./build.sh`,
#  which build.sh forwards as IGconf_mpf_version.
# X-Env-Var-version-Required: n
# X-Env-Var-version-Valid: regex:^[0-9]+\.[0-9]+$
# X-Env-Var-version-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - python3
    - python3-venv
    - python3-pip
    - python3-dev
    - libssl-dev
    - libncurses-dev
    - libffi-dev
    - libreadline-dev
    - libbz2-dev
    - libsqlite3-dev
    - liblzma-dev
    - tk-dev
    - libgstreamer1.0-dev
    - libgstreamer-plugins-base1.0-dev
    - libsdl2-dev
    - libsdl2-image-dev
    - libsdl2-mixer-dev
    - libavcodec-dev
    - libavformat-dev
    - libswscale-dev
    - libavdevice-dev
    - libavfilter-dev
    - cmake
    - build-essential
    - pkg-config
    - libftdi1-2
    - libftdi1-dev
  customize-hooks:
    - chroot $1 python3 -m venv /opt/mpf/venv
    - chroot $1 /opt/mpf/venv/bin/pip install --upgrade pip
    - |-
      # Pinned to a release line, not an exact patch (see
      # docs/rpi-image-gen-notes.md) — mpf-mc only, no mpf-monitor (needs
      # PyQt6, known Pi compatibility issues). The version comes from this
      # layer's own `version` variable, declared above, which is also what
      # names the built image.
      chroot $1 /opt/mpf/venv/bin/pip install "mpf~=$IGconf_mpf_version.0" "mpf-mc~=$IGconf_mpf_version.0"
    - |-
      # Work around a real upstream bug in mpf itself (reproduced and
      # verified independently of this image, on a clean
      # python:3.11-bookworm container — see docs/rpi-image-gen-notes.md):
      # mpf's CLI loader uses the legacy pkg_resources API, which raises
      # DistributionNotFound for "ruamel.yaml.clib>=0.2.7" even though pip
      # installed it correctly. Duplicate its dist-info dir under its dotted
      # name — purely additive, doesn't touch any installed files.
      chroot $1 bash -c '
        cd /opt/mpf/venv/lib/python3.*/site-packages
        cp -r ruamel_yaml_clib-*.dist-info "$(ls -d ruamel_yaml_clib-*.dist-info | sed "s/^ruamel_yaml_clib/ruamel.yaml.clib/")"
      '
    - |-
      # Let the login user manage the venv later (add packages for their
      # machine folder, etc.) without needing sudo.
      chroot $1 chown -R "$IGconf_device_user1:$IGconf_device_user1" /opt/mpf
    - |-
      # So `mpf`/`mpf-mc`/`pip` work without the full /opt/mpf/venv/bin/
      # path, for both the autologin console session and interactive SSH
      # logins (both are login shells, which source /etc/profile.d/*.sh).
      mkdir -p $1/etc/profile.d
      cat <<'EOCHROOT' > $1/etc/profile.d/mpf-path.sh
      export PATH="/opt/mpf/venv/bin:$PATH"
      EOCHROOT
