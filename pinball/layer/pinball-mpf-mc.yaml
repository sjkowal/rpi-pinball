# METABEGIN
# X-Env-Layer-Name: pinball-mpf-mc
# X-Env-Layer-Category: app-misc
# X-Env-Layer-Desc: The legacy Kivy/SDL2 media controller (mpf-mc) for the
#  MPF 0.57 and 0.58 lines, installed into pinball-mpf's venv. Selected by
#  pinball/pinball-mpf57.yaml and pinball-mpf58.yaml. MPF 0.80+ use the
#  Godot Media Controller (pinball-gmc) instead.
#
#  There is no mpf-mc 0.58: the newest release, 0.57.1, requires
#  "mpf >= 0.57.0" and serves both lines. It also requires Python < 3.12
#  (Kivy 2.2.1), which is why these lines stay on Debian's Python 3.11.
# X-Env-Layer-Version: 2.0.0
# X-Env-Layer-Requires: pinball-mpf
#
# X-Env-VarPrefix: mpfmc
#
# X-Env-Var-version: 0.57.1
# X-Env-Var-version-Desc: Exact mpf-mc release to install.
# X-Env-Var-version-Required: n
# X-Env-Var-version-Valid: regex:^[0-9]+\.[0-9]+\.[0-9]+$
# X-Env-Var-version-Set: y
# METAEND
---
mmdebstrap:
  packages:
    # Build/runtime deps for mpf-mc and the pieces pip compiles from source
    # (mpf-mc itself, ffpyplayer) -- see docs/rpi-image-gen-notes.md.
    - tk-dev
    - libgstreamer1.0-dev
    - libgstreamer-plugins-base1.0-dev
    - libsdl2-dev
    - libsdl2-image-dev
    - libsdl2-mixer-dev
    - libavcodec-dev
    - libavformat-dev
    - libswscale-dev
    - libavdevice-dev
    - libavfilter-dev
    - cmake
  customize-hooks:
    - |-
      # mpf is named again, at its exact version, so resolving mpf-mc's
      # "mpf >= 0.57.0" can never move it.
      chroot $1 /opt/mpf/venv/bin/pip install "mpf==$IGconf_mpf_version" "mpf-mc==$IGconf_mpfmc_version"
    - |-
      # pinball-mpf chowned /opt/mpf to the login user before this layer
      # ran; pip just left root-owned files behind, so redo it.
      chroot $1 chown -R "$IGconf_device_user1:$IGconf_device_user1" /opt/mpf
    - |-
      # mpf-mc contributes `mpf mc`/`mpf both` via the mpf.command entry
      # point group, which mpf's CLI loads through pkg_resources -- so
      # re-check the CLI now that there is something for it to load.
      chroot $1 env HOME=/root /opt/mpf/venv/bin/mpf --help > /dev/null
    - |-
      # And MPF is still exactly the pinned version after mpf-mc's install.
      chroot $1 /opt/mpf/venv/bin/python -c "import sys, mpf._version as v, mpfmc._version as m; print('MPF', v.__version__, '+ MPF-MC', m.__version__); sys.exit(v.__version__ != '$IGconf_mpf_version')"
